<nav class="navbar">
  <div class="navbar-inner">
    <a routerLink="/" class="navbar-logo">Álvaro Antón Maciá</a>

    <button class="mobile-toggle" (click)="menuOpen = !menuOpen" [class.active]="menuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="navbar-links" [class.open]="menuOpen">
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="menuOpen = false">{{ i18n.t().nav.home }}</a>
      </li>
      <li>
        <a routerLink="/proyectos" routerLinkActive="active" (click)="menuOpen = false">{{ i18n.t().nav.projects }}</a>
      </li>
      @if (auth.admin()) {
        <li>
          <a routerLink="/admin" routerLinkActive="active" (click)="menuOpen = false" class="admin-link">CRM</a>
        </li>
      }
      <li class="lang-toggle">
        <button
          class="lang-btn theme-btn"
          (click)="theme.toggle()"
          [attr.aria-label]="theme.theme() === 'dark'
            ? (i18n.lang() === 'es' ? 'Cambiar a tema claro' : 'Switch to light theme')
            : (i18n.lang() === 'es' ? 'Cambiar a tema oscuro' : 'Switch to dark theme')"
          [title]="theme.theme() === 'dark'
            ? (i18n.lang() === 'es' ? 'Tema claro' : 'Light theme')
            : (i18n.lang() === 'es' ? 'Tema oscuro' : 'Dark theme')"
        >
          @if (theme.theme() === 'dark') {
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
            </svg>
          }
        </button>
      </li>
      <li class="lang-toggle">
        <button class="lang-btn" (click)="i18n.toggle(); menuOpen = false">
          {{ i18n.lang() === 'es' ? 'EN' : 'ES' }}
        </button>
      </li>
    </ul>
  </div>
</nav>
